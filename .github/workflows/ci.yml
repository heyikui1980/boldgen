name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 在 ubuntu-24.04（ubuntu-latest）上没有 setup-python 构建，
          # 要跑就得回到 22.04。
          - { python-version: "3.9",  os: ubuntu-22.04 }
          - { python-version: "3.10", os: ubuntu-latest }
          - { python-version: "3.11", os: ubuntu-latest }
          - { python-version: "3.12", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
          - { python-version: "3.14", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 内置引擎零依赖；测试用内置 writer 现场构造字体，不依赖系统字体。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: 跑测试
        run: python -m pytest -q

  build:
    name: 打包 (sdist + wheel)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装打包工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: 构建
        run: python -m build

      - name: 检查产物里没有字体文件
        run: |
          # 衍生字体受源字体授权约束，绝不能进发行包
          if find dist/ -type f \( -name '*.ttf' -o -name '*.ttc' -o -name '*.otf' -o -name '*.otc' \) | grep -q .; then
            echo "::error::发行包里出现了字体文件"
            find dist/ -type f \( -name '*.ttf' -o -name '*.ttc' -o -name '*.otf' -o -name '*.otc' \)
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lint:
    name: 冒烟测试（已安装的 CLI）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: CLI 冒烟
        run: |
          set -eux
          boldgen --version
          # scan 在没有 fc-list 的环境里也应该优雅退出而不是崩
          boldgen scan || true
          # mktest 不依赖任何字体，应能生成 docx
          boldgen mktest --out "$RUNNER_TEMP/smoke.docx"
          test -s "$RUNNER_TEMP/smoke.docx"
          python -c "import os,zipfile; z=zipfile.ZipFile(os.environ['RUNNER_TEMP'] + '/smoke.docx'); assert 'word/document.xml' in z.namelist(); print('docx 结构 OK')"
